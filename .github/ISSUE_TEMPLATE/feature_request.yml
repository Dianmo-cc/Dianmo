name: 功能建议
description: 新功能或改进建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题或需求？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望的解决方式
      description: 描述你期望的功能或改进
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他补充
      description: 参考截图、其他应用的做法等
