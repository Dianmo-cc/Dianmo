name: 问题反馈
description: 闪退、显示异常、功能不正常等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有相同的 Issue。
        **目前暂不接受书源兼容问题**（某个书源无法搜索、目录或正文异常等）。
        **请勿粘贴 Cookie、令牌、API 密钥、账号密码等隐私信息。**
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
        - label: 我使用的是最新 Beta 版本，且未过期（可在「我的 → 关于」查看到期时间）
          required: true
  - type: input
    id: version
    attributes:
      label: 点墨版本
      description: 「我的 → 关于」中显示的版本号
      placeholder: 例如 1.0-abc1234 (12)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 例如 iPhone 16 / iOS 26.2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 截图或录屏
      description: 可直接拖入图片或视频
  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 例如出现频率、是否与特定操作有关等
